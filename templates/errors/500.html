{% extends "base.html" %}

{% block title %}Server Error - FreshMart{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
            <h1 class="mt-4">500 - Server Error</h1>
            <p class="lead text-muted">Something went wrong on our end. Please try again later.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-success btn-lg mt-3">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
